name: Sync nxnative

on:
  schedule:
    - cron: '0 19 * * *' # 03:00 Asia/Shanghai; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-nxnative
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      base: ${{ steps.sync.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Import upstream and apply local controller policy
        id: sync
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 -B scripts/sync_engine.py
          if git diff --quiet HEAD -- Engine; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            mkdir -p work
            tar -czf work/nxnative-candidate.tar.gz Engine
          fi
      - name: Upload candidate sources
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nxnative-candidate
          path: work/nxnative-candidate.tar.gz
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    # Permit the reusable workflow's tag-release job definition. Its Mac test
    # job explicitly has read-only contents; its release job is skipped here.
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
    with:
      engine-artifact: nxnative-candidate
      source-ref: ${{ needs.candidate.outputs.base }}

  publish:
    needs: [candidate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Reject a stale candidate
        env:
          TESTED_BASE: ${{ needs.candidate.outputs.base }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_BASE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nxnative-candidate
          path: work/engine-candidate
      - name: Restore the verified candidate
        run: |
          rm -rf Engine/nxnative
          tar -xzf work/engine-candidate/nxnative-candidate.tar.gz
      - name: Commit only the successfully tested engine
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Engine
          git commit -m "chore: sync tested nxnative snapshot"
          git push origin HEAD:main
